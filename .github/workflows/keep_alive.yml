name: Keep Database Alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/health" \
            --fail \
            --silent \
            --max-time 30 \
            || echo "Health check failed but continuing"
