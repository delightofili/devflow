name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint + Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        # npm ci is faster than npm install in CI
        # uses package-lock.json exactly, no version resolution

      - name: Generate Prisma client
        run: npx prisma generate
        # generate must run before type checking
        # otherwise Prisma types don't exist yet

      - name: Type check
        run: npx tsc --noEmit
        # --noEmit checks types without outputting files
        # catches TypeScript errors without a full build

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0
        # --max-warnings 0 means any warning fails the CI
        # keeps code quality high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # only runs if lint-and-typecheck passes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          # build needs these env vars even though it's not running
